# Comma-separated physical evdev keys/chords.
# Modifiers: CTRL, ALT, SHIFT, META (SUPER and WIN are aliases).
# Examples: PRINT, F12, CTRL+ALT+P, META+SHIFT+S
triggers=PRINT

# On KDE, register the exact configured chord with KGlobalAccel so it is
# consumed by the compositor. Capture still starts from the evdev fast path.
consume_kde_shortcuts=true

# Keep disabled for zero-side-effect capture. If direct KWin capture fails,
# launching Spectacle can create a window and exit Peek at Desktop.
allow_gui_fallback=false

# Output modes:
#   clipboard - copy only; do not persist a screenshot file (default)
#   file      - save only; do not touch the clipboard
#   both      - save and copy to the clipboard
output_mode=clipboard

# Used by output_mode=file or both. A directory gets an automatic filename.
# Full paths may use strftime placeholders plus {ms} for milliseconds.
save_path=~/Pictures/Screenshot-%Y%m%d-%H%M%S-{ms}.png
